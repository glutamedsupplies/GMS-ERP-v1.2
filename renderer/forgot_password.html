<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<style>
  :root {
    --primary: #2575fc;
    --primary-soft: #dbeafe;
    --text: #0f172a;
    --muted: #475569;
    --line: #d6deef;
    --panel: #ffffff;
    --danger: #b91c1c;
    --ok: #15803d;
    --shadow: 0 18px 46px rgba(15, 23, 42, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top left, rgba(37, 117, 252, 0.2), transparent 28%),
      linear-gradient(145deg, #f8fbff, #ebf1ff);
  }

  .page {
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 16px 42px;
  }

  .hero {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .hero h1 {
    margin: 0 0 4px;
    font-size: 32px;
    line-height: 1.2;
  }

  .hero p {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
  }

  .back-link {
    text-decoration: none;
    color: var(--primary);
    font-weight: 700;
    white-space: nowrap;
    margin-top: 8px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    box-shadow: var(--shadow);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field {
    margin-bottom: 12px;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
  }

  input,
  textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 11px 12px;
    font-size: 14px;
    color: var(--text);
    background: #fff;
    outline: none;
  }

  input:focus,
  textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 117, 252, 0.15);
  }

  textarea {
    min-height: 88px;
    resize: vertical;
    line-height: 1.45;
  }

  .actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 2px;
  }

  button {
    border: none;
    border-radius: 11px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .primary {
    background: var(--primary);
    color: #fff;
  }

  .secondary {
    background: var(--primary-soft);
    color: var(--primary);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .status {
    margin-top: 14px;
    min-height: 24px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.45;
  }

  .status.error { color: var(--danger); }
  .status.ok { color: var(--ok); }

  .result-box {
    margin-top: 12px;
    padding: 12px;
    border-radius: 12px;
    border: 1px dashed #bcd0f6;
    background: #f5f9ff;
    display: none;
  }

  .result-box strong {
    display: block;
    margin-bottom: 5px;
  }

  .code {
    font-weight: 800;
    letter-spacing: 0.05em;
  }

  @media (max-width: 760px) {
    .hero,
    .row {
      grid-template-columns: 1fr;
      display: grid;
    }

    .hero h1 {
      font-size: 27px;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <div>
        <h1 id="forgotTitle">Forgot Password</h1>
        <p id="forgotSubtitle">Submit a recovery request and support will help reset your password.</p>
      </div>
      <a class="back-link" href="/index.html">Back to Login</a>
    </div>

    <div class="card">
      <form id="forgotPasswordForm">
        <div class="row">
          <div class="field">
            <label for="companyCodeInput">Company Code</label>
            <input id="companyCodeInput" type="text" placeholder="Enter company code" required>
          </div>
          <div class="field">
            <label for="usernameInput">ID Number / Username</label>
            <input id="usernameInput" type="text" placeholder="Your login ID" required>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="nameInput">Full Name</label>
            <input id="nameInput" type="text" placeholder="Your full name" required>
          </div>
          <div class="field">
            <label for="contactInput">Contact Number</label>
            <input id="contactInput" type="text" inputmode="numeric" placeholder="09..." required>
          </div>
        </div>

        <div class="field">
          <label for="messageInput">Message (Optional)</label>
          <textarea id="messageInput" placeholder="Any extra details for support..."></textarea>
        </div>

        <div class="actions">
          <button type="submit" id="submitBtn" class="primary">Send Recovery Request</button>
          <a class="secondary" id="openChatLink" href="/renderer/customer_portal.html">Open Customer Chat</a>
        </div>

        <div id="status" class="status"></div>
        <div id="resultBox" class="result-box">
          <strong>Request Sent</strong>
          <span>Your request code: <span id="requestCodeLabel" class="code">-</span></span>
        </div>
      </form>
    </div>
  </div>

  <script src="/shared/app-client.js"></script>
  <script src="/renderer/forgot_password.js"></script>
</body>
</html>
