<!DOCTYPE html>
<html lang="en" data-app-page="forgot">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://www.googleapis.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0ea5a4">
<title id="pageTitle">Forgot Password</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Sora:wght@400;500;600;700&display=swap');

  :root{
    --brand-primary:#0ea5a4;
    --brand-primary-rgb:14,165,164;
    --page-gradient:
      radial-gradient(circle at 12% 18%, rgba(45, 212, 191, 0.28) 0%, transparent 36%),
      radial-gradient(circle at 88% 10%, rgba(251, 191, 36, 0.22) 0%, transparent 34%),
      linear-gradient(140deg, #0b1220 0%, #0b1c2d 56%, #0f172a 100%);
    --button-gradient:linear-gradient(135deg, #2dd4bf 0%, #14b8a6 56%, #22c55e 100%);
    --card-border:rgba(255,255,255,0.14);
    --card-shadow:0 36px 90px rgba(2, 6, 23, 0.55);
    --input-surface:rgba(255,255,255,0.08);
    --input-border:rgba(255,255,255,0.12);
    --text-main:#f8fafc;
    --text-soft:rgba(226,232,240,0.86);
    --text-faint:rgba(148,163,184,0.84);
    --background-image:none;
  }

  *{box-sizing:border-box}

  html,
  body{
    min-height:100%;
  }

  body{
    margin:0;
    min-height:100dvh;
    height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;
    padding:clamp(10px, 2.4vh, 20px) clamp(10px, 2vw, 18px);
    font-family:'Sora',sans-serif;
    color:var(--text-main);
    background:var(--page-gradient);
    transition:background .72s ease;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(135deg, rgba(2,6,23,0.12) 0%, rgba(2,6,23,0.78) 100%),
      radial-gradient(circle at top, rgba(255,255,255,0.06) 0%, transparent 36%);
  }

  .background-photo{
    position:fixed;
    inset:-8%;
    background-image:var(--background-image);
    background-position:center;
    background-size:cover;
    filter:blur(18px) saturate(1.12) brightness(0.66);
    transform:scale(1.02);
    opacity:0;
    transition:opacity .55s ease, transform .75s ease;
    pointer-events:none;
  }

  .background-photo.has-image{
    opacity:0.92;
    transform:scale(1.08);
  }

  .ambient{
    position:fixed;
    border-radius:999px;
    filter:blur(14px);
    opacity:0.78;
    pointer-events:none;
    mix-blend-mode:screen;
    animation:floatOrb 16s ease-in-out infinite;
  }

  .ambient-a{
    top:-90px;
    left:-70px;
    width:320px;
    height:320px;
    background:radial-gradient(circle, rgba(var(--brand-primary-rgb),0.4) 0%, rgba(255,255,255,0) 68%);
  }

  .ambient-b{
    right:-70px;
    bottom:-90px;
    width:360px;
    height:360px;
    background:radial-gradient(circle, rgba(251,191,36,0.22) 0%, rgba(255,255,255,0) 68%);
    animation-delay:-5s;
  }

  .ambient-c{
    top:44%;
    left:50%;
    width:260px;
    height:260px;
    background:radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 72%);
    animation-delay:-10s;
  }

  .login-shell{
    position:relative;
    z-index:1;
    width:min(100%, 410px);
    max-height:100%;
    display:flex;
    align-items:center;
  }

  .login-card{
    position:relative;
    overflow:hidden;
    width:100%;
    max-height:calc(100dvh - 24px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:clamp(18px, 3.4vh, 34px) clamp(16px, 4vw, 28px);
    border-radius:26px;
    border:1px solid var(--card-border);
    background:linear-gradient(160deg, rgba(15,23,42,0.82), rgba(6,10,20,0.86));
    box-shadow:var(--card-shadow);
    backdrop-filter:blur(20px) saturate(1.08);
  }

  .login-card-glow{
    position:absolute;
    inset:auto -18% 58% auto;
    width:220px;
    height:220px;
    border-radius:999px;
    background:radial-gradient(circle, rgba(var(--brand-primary-rgb),0.38) 0%, rgba(var(--brand-primary-rgb),0) 72%);
    filter:blur(10px);
    pointer-events:none;
  }

  .logo-container{
    position:relative;
    width:clamp(72px, 11vh, 98px);
    height:clamp(72px, 11vh, 98px);
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    padding:0;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 18px 38px rgba(2, 6, 23, 0.32);
    overflow:hidden;
  }

  .logo-container img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
    border-radius:50%;
  }

  h1{
    margin:0 0 6px;
    text-align:center;
    font-family:'Fraunces',serif;
    font-size:clamp(26px, 5vw, 36px);
    line-height:1.04;
    letter-spacing:-0.02em;
    text-shadow:0 10px 28px rgba(2, 6, 23, 0.3);
  }

  .subtitle{
    text-align:center;
    color:var(--text-soft);
    font-size:13px;
    font-weight:600;
  }

  .company-hint{
    margin:8px auto 14px;
    max-width:260px;
    text-align:center;
    color:var(--text-faint);
    font-size:11.5px;
    line-height:1.4;
  }

  .input-group{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    margin:8px 0;
    border:1px solid var(--input-border);
    border-radius:16px;
    padding:0 12px;
    background:var(--input-surface);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);
    transition:border-color .22s ease, box-shadow .22s ease, transform .22s ease, background .22s ease;
  }

  .input-group:focus-within{
    border-color:rgba(var(--brand-primary-rgb),0.5);
    box-shadow:0 0 0 4px rgba(var(--brand-primary-rgb),0.12), inset 0 1px 0 rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.12);
    transform:translateY(-1px);
  }

  .input-icon{
    width:18px;
    text-align:center;
    color:var(--text-soft);
    font-size:15px;
    flex:0 0 auto;
  }

  .input-group input{
    flex:1;
    height:46px;
    border:none;
    outline:none;
    background:transparent;
    color:var(--text-main);
    font-size:15px;
    font-weight:600;
    min-width:0;
  }

  .input-group input::placeholder{
    color:rgba(226,232,240,0.56);
    font-weight:500;
  }

  .login-btn{
    width:100%;
    height:46px;
    margin-top:12px;
    border:none;
    border-radius:16px;
    font:inherit;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease, border-color .18s ease;
    background:var(--button-gradient);
    color:#fff;
    font-size:16px;
    font-weight:800;
    box-shadow:0 18px 34px rgba(var(--brand-primary-rgb),0.3);
  }

  .login-btn:hover{
    transform:translateY(-2px);
  }

  .login-btn:disabled{
    opacity:.74;
    cursor:wait;
    transform:none;
    filter:saturate(.85);
  }

  .secondary-btn{
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.22);
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
  }

  .secondary-btn:hover{
    filter: brightness(1.02);
  }

  .link-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:12px;
  }

  .link-btn,
  .forgot-link{
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.24);
    padding: 6px 12px;
    color: #f8fafc;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
    border-radius:999px;
    cursor:pointer;
    box-shadow: 0 8px 18px rgba(2, 6, 23, 0.32);
  }

  .link-btn:hover,
  .forgot-link:hover{
    filter: brightness(0.98);
  }

  .status{
    min-height:18px;
    margin-top:12px;
    text-align:center;
    font-size:12px;
    line-height:1.35;
    font-weight:700;
    color:var(--text-soft);
  }

  .status.error{
    color:#ff7a7a;
  }

  .status.ok{
    color:#86efac;
  }

  .result-box{
    margin-top:10px;
    padding:12px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.16);
    background:rgba(15, 23, 42, 0.65);
    color:var(--text-soft);
    display:none;
  }

  .result-box strong{
    display:block;
    margin-bottom:4px;
    color:#ffffff;
  }

  @keyframes floatOrb{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(20px)}
  }

  @media (max-width: 540px){
    .login-card{
      padding:20px 18px;
    }

    .link-row{
      flex-direction:column;
      align-items:flex-start;
    }
  }
</style>
</head>
<body>
  <div class="background-photo" id="backgroundPhoto"></div>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient ambient-c"></div>

  <main class="login-shell">
    <section class="login-card" id="forgotCard">
      <div class="login-card-glow" aria-hidden="true"></div>
      <div class="logo-container" id="logoContainer">
        <img id="brandLogo" src="/logo.png" alt="Company Logo">
      </div>
      <h1 id="forgotTitle">GMS ERP Forgot Password</h1>
      <div class="subtitle" id="forgotSubtitle">Enter your email and we'll send a reset code.</div>
      <div class="company-hint" id="brandingHint">Type your company ID to preview your company theme.</div>

      <form id="forgotPasswordForm" autocomplete="off">
        <div class="input-group company-code-group" id="companyCodeGroup">
          <span class="input-icon"><i class="fa-regular fa-building"></i></span>
          <input id="companyCodeInput" type="text" name="forgot_company_code" placeholder="Company ID" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <div class="input-group">
          <span class="input-icon"><i class="fa-regular fa-envelope"></i></span>
          <input id="emailInput" type="email" name="forgot_email" placeholder="Email" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
        <div class="input-group">
          <span class="input-icon"><i class="fa-solid fa-key"></i></span>
          <input id="codeInput" type="text" placeholder="Verification code" inputmode="numeric" autocomplete="one-time-code">
        </div>
        <div class="input-group">
          <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
          <input id="newPasswordInput" type="password" placeholder="New password" autocomplete="new-password" disabled>
        </div>
        <div class="input-group">
          <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
          <input id="confirmPasswordInput" type="password" placeholder="Confirm new password" autocomplete="new-password" disabled>
        </div>
        <button type="button" id="sendCodeBtn" class="login-btn">Send Code</button>
        <button type="button" id="resetPasswordBtn" class="login-btn secondary-btn">Reset Password</button>
      </form>

      <div class="link-row">
        <a class="link-btn" href="/index.html">Back to Login</a>
        <a class="forgot-link" id="openChatLink" href="/renderer/customer_portal.html">Open Customer Chat</a>
      </div>

      <div id="status" class="status"></div>
      <div id="resultBox" class="result-box">
        <strong>Reset Code Sent</strong>
        <span>If the email is registered, a reset code will arrive in a few minutes.</span>
      </div>
    </section>
  </main>

  <script type="module" src="/shared/firebase.js"></script>
  <script src="/shared/app-client.js"></script>
  <script src="/renderer/forgot_password.js"></script>
</body>
</html>
