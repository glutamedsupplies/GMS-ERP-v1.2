<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Card Editor</title>
  <script src="../shared/theme-preload.js"></script>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-muted: #f1f5f9;
      --line: #dbe4ef;
      --line-strong: #b8c7d9;
      --text: #102033;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-strong: #1d4ed8;
      --success: #047857;
      --danger: #b91c1c;
      --warning: #b45309;
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Segoe UI Variable", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .shell {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 28px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .top-actions,
    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    button,
    .link-button {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      background: var(--primary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 160ms ease, transform 160ms ease, opacity 160ms ease;
    }

    button:hover:not(:disabled),
    .link-button:hover {
      background: var(--primary-strong);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .secondary {
      color: var(--text);
      background: #e2e8f0;
    }

    .secondary:hover:not(:disabled),
    .link-button.secondary:hover {
      background: #cbd5e1;
    }

    .danger {
      background: var(--danger);
    }

    .danger:hover:not(:disabled) {
      background: #991b1b;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1.3fr) minmax(220px, 1.1fr) minmax(160px, 0.7fr) auto;
      gap: 12px;
      align-items: end;
      padding: 16px;
      margin-bottom: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    select,
    input,
    textarea {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      background: #ffffff;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 40px;
      resize: vertical;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .status-line {
      min-height: 22px;
      margin: -4px 0 12px;
      color: var(--primary);
      font-weight: 700;
    }

    .status-line.is-error {
      color: var(--danger);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .table-panel {
      overflow: hidden;
    }

    .table-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
    }

    .table-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      background: var(--panel-muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      font-size: 14px;
    }

    .date-cell strong,
    .status-preview strong {
      display: block;
      font-size: 14px;
      line-height: 1.35;
    }

    .date-cell span,
    .status-preview span,
    .row-status {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .time-input {
      width: 112px;
    }

    .hours-input {
      width: 110px;
    }

    .remarks-input {
      min-width: 230px;
    }

    .row-actions {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .row-actions button {
      min-height: 36px;
      padding: 0 12px;
    }

    .empty-row {
      padding: 26px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #075985;
      font-size: 12px;
      font-weight: 800;
    }

    .pill.is-error {
      background: #fee2e2;
      color: var(--danger);
    }

    @media (max-width: 980px) {
      .topbar,
      .table-head {
        align-items: stretch;
        flex-direction: column;
      }

      .top-actions,
      .actions {
        justify-content: flex-start;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100% - 20px, 1440px);
        padding-top: 12px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Super Admin</p>
        <h1>Time Card Editor</h1>
      </div>
      <div class="top-actions">
        <a class="link-button secondary" href="./dashboard.html">Dashboard</a>
        <button id="refreshBtn" type="button" class="secondary">Refresh</button>
        <button id="logoutBtn" type="button" class="danger">Log Out</button>
      </div>
    </header>

    <section class="panel controls">
      <label>
        Company
        <select id="companySelect"></select>
      </label>
      <label>
        Employee
        <select id="employeeSelect"></select>
      </label>
      <label>
        Cutoff Date
        <input id="cutoffDateInput" type="date">
      </label>
      <div class="actions">
        <button id="loadBtn" type="button">Load</button>
      </div>
    </section>

    <div id="statusLine" class="status-line" role="status" aria-live="polite"></div>

    <section class="summary" aria-label="Time card summary">
      <div class="metric">
        <span>Company</span>
        <strong id="summaryCompany">-</strong>
      </div>
      <div class="metric">
        <span>Employee</span>
        <strong id="summaryEmployee">-</strong>
      </div>
      <div class="metric">
        <span>Cutoff</span>
        <strong id="summaryCutoff">-</strong>
      </div>
      <div class="metric">
        <span>Present</span>
        <strong id="summaryPresent">0</strong>
      </div>
      <div class="metric">
        <span>Total Hours</span>
        <strong id="summaryHours">0.00</strong>
      </div>
    </section>

    <section class="panel table-panel">
      <div class="table-head">
        <h2 id="tableTitle">Cutoff Rows</h2>
        <span id="editorScopePill" class="pill">Super admin only</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Time In</th>
              <th>Time Out</th>
              <th>Worked Hours</th>
              <th>Status / Remarks</th>
              <th>Current</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="timecardTableBody">
            <tr><td colspan="7" class="empty-row">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <datalist id="statusOptions">
    <option value="On Time"></option>
    <option value="Late"></option>
    <option value="Absent"></option>
    <option value="Excuse"></option>
    <option value="Day Off"></option>
    <option value="Holiday"></option>
  </datalist>

  <script>window.GMS_DISABLE_AI_ASSISTANT = true;</script>
  <script src="../shared/app-client.js"></script>
  <script src="./time_card_editor.js"></script>
</body>
</html>
