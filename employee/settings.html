<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="./portal.css">
</head>
<body class="employee-page">
  <main class="employee-shell employee-shell--narrow">
    <div class="page-topbar">
      <button class="back-link" id="backBtn" type="button"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</button>
      <span class="surface-note"><i class="fa-solid fa-user-gear"></i> Account and profile controls</span>
    </div>

    <section class="settings-card">
      <div class="settings-header">
        <p class="hero-kicker">Personal Workspace</p>
        <h2>Account Settings</h2>
        <p>Keep your profile current without breaking the layout on smaller devices.</p>
      </div>

      <div class="profile-section">
        <div class="profile-pic-wrapper">
          <img id="profilePic" class="profile-pic" src="https://ui-avatars.com/api/?name=User&background=2c2c2c&color=fff&size=128" alt="Profile">
        </div>
        <label class="upload-label">
          <i class="fa-solid fa-camera"></i> Change Photo
          <input type="file" id="fileInput" accept="image/*" hidden onchange="loadImage(event)">
        </label>
      </div>

      <div class="form-grid">
        <div class="field">
          <label>Employee ID</label>
          <input type="text" id="userIdDisplay" readonly>
        </div>

        <div class="field">
          <label>Full Name</label>
          <input type="text" id="name">
        </div>

        <div class="field">
          <label>New Password</label>
          <div class="input-group">
            <input type="password" id="password" placeholder="Leave blank to keep current password">
            <i class="fa-solid fa-eye toggle-password" id="toggleNewPass"></i>
          </div>
        </div>

        <div class="field">
          <label>Confirm Password</label>
          <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="Retype new password">
            <i class="fa-solid fa-eye toggle-password" id="toggleConfirmPass"></i>
          </div>
        </div>
      </div>

      <div class="settings-actions">
        <button class="primary-button" id="saveBtn" type="button">Save Changes</button>
        <div class="status-banner" id="statusText"></div>
        <button class="danger-button" id="logoutBtn" type="button">Log Out</button>
      </div>
    </section>
  </main>

  <script src="../shared/app-client.js"></script>
  <script src="settings.js"></script>
</body>
</html>
