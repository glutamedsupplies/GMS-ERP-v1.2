<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #232526, #414345);
            color: white;
            overflow: hidden;
        }

        .settings-card {
            width: 380px;
            background: rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 {
            text-align: center;
            margin: 0 0 20px 0;
            font-weight: 600;
            font-size: 22px;
        }

        .backBtn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            padding: 6px 12px;
            background: rgba(41, 128, 185, 0.8);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 12px;
        }

        .backBtn:hover { background: #3498db; }

        /* IMAGE CONTAINER SETUP */
        .profile-pic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .profile-pic-wrapper {
            position: relative;
            width: 115px;
            height: 115px;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover; /* Pinaka-importante para hindi stretched ang mukha */
            object-position: center;
            border: 4px solid #00e676;
            background: #2c2c2c;
            display: block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .upload-btn {
            margin-top: 12px;
            font-size: 13px;
            cursor: pointer;
            color: #00e676;
            font-weight: 600;
            transition: 0.2s;
            text-decoration: underline;
        }

        .upload-btn:hover {
            color: #00ff84;
            transform: scale(1.05);
        }

        /* FORM STYLING */
        .section {
            margin-bottom: 15px;
            width: 100%;
        }

        label {
            display: block;
            font-size: 11px;
            margin-bottom: 5px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.95);
            color: #222;
        }

        input[readonly] {
            background: rgba(255, 255, 255, 0.1);
            color: #bbb;
            cursor: not-allowed;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .password-input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #555;
            font-size: 14px;
            z-index: 10;
        }

        /* BUTTONS */
        .save-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: #00c853;
            color: white;
            margin-top: 10px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
        }

        .save-btn:hover {
            background: #00e676;
            transform: translateY(-2px);
        }

        .logout-btn {
            width: 100%;
            height: 40px;
            background: transparent;
            color: #ff5252;
            border: 1px solid #ff5252;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .logout-btn:hover { background: #ff5252; color: white; }

        .status-msg {
            text-align: center;
            font-size: 12px;
            min-height: 18px;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="settings-card">
    <button class="backBtn" id="backBtn">
        <i class="fa-solid fa-arrow-left"></i> Back
    </button>
    
    <h2>Account Settings</h2>

    <div class="profile-pic-container">
        <div class="profile-pic-wrapper">
            <img id="profilePic" class="profile-pic" src="https://ui-avatars.com/api/?name=User&background=2c2c2c&color=fff&size=128" alt="Profile">
        </div>
        <label class="upload-btn">
            <i class="fa-solid fa-camera"></i> Change Photo
            <input type="file" id="fileInput" accept="image/*" hidden onchange="loadImage(event)">
        </label>
    </div>

    <div class="section">
        <label>Employee ID</label>
        <input type="text" id="userIdDisplay" readonly>
    </div>

    <div class="section">
        <label>Full Name</label>
        <input type="text" id="name"> 
    </div>
    
    <div class="section">
        <label>New Password</label>
        <div class="input-group">
            <input type="password" id="password" class="password-input" placeholder="Leave blank to keep current password">
            <i class="fa-solid fa-eye toggle-password" id="toggleNewPass"></i>
        </div>
    </div>

    <div class="section">
        <label>Confirm Password</label>
        <div class="input-group">
            <input type="password" id="confirmPassword" class="password-input">
            <i class="fa-solid fa-eye toggle-password" id="toggleConfirmPass"></i>
        </div>
    </div>

    <button class="save-btn" id="saveBtn" type="button">Save Changes</button>

    <div class="status-msg" id="statusText"></div>

    <button class="logout-btn" id="logoutBtn" type="button">Logout</button>
</div>

<script src="../shared/app-client.js"></script>
<script src="settings.js"></script>

</body>
</html>
