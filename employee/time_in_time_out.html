<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time In / Time Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="./portal.css">
</head>
<body class="employee-page">
  <main class="employee-shell employee-shell--narrow">
    <div class="page-topbar">
      <button class="back-link" id="backBtn" type="button"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</button>
      <span class="surface-note"><i class="fa-solid fa-bolt"></i> Live shift controls</span>
    </div>

    <section class="attendance-card">
      <p class="hero-kicker">Attendance Station</p>
      <h1 class="page-title">Time In / Time Out</h1>
      <p class="welcome-copy" id="welcomeUser">Welcome</p>
      <div class="clock-display" id="clock">00:00:00</div>
      <div class="date-label" id="date"></div>

      <div class="action-row">
        <button id="timeInBtn" class="action-button" type="button">Time In</button>
        <button id="timeOutBtn" class="action-button is-danger" type="button" disabled>Time Out</button>
      </div>

      <div class="status-banner" id="statusText"></div>
    </section>
  </main>

  <script src="../shared/app-client.js"></script>
  <script src="time_in_time_out.js"></script>
</body>
</html>
