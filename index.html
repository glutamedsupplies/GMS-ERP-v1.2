<!DOCTYPE html>
<html lang="en" data-app-page="index">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2575fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<title id="pageTitle">GMS ERP Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');

  :root{
    --brand-primary:#2575fc;
    --brand-primary-rgb:37,117,252;
    --page-gradient:
      radial-gradient(circle at 15% 20%, rgba(96, 165, 250, 0.28) 0%, transparent 34%),
      radial-gradient(circle at 85% 0%, rgba(167, 139, 250, 0.24) 0%, transparent 28%),
      linear-gradient(140deg, #123d94 0%, #0b1735 58%, #020617 100%);
    --button-gradient:linear-gradient(135deg, #3b82f6 0%, #8b5cf6 58%, #ec4899 100%);
    --card-surface:rgba(8, 15, 31, 0.46);
    --card-border:rgba(255,255,255,0.16);
    --card-shadow:0 30px 80px rgba(2, 6, 23, 0.45);
    --input-surface:rgba(255,255,255,0.1);
    --input-border:rgba(255,255,255,0.08);
    --text-main:#ffffff;
    --text-soft:rgba(226,232,240,0.82);
    --text-faint:rgba(226,232,240,0.62);
    --glow:rgba(37,117,252,0.32);
    --background-image:none;
  }

  *{box-sizing:border-box}

  html,
  body{
    min-height:100%;
  }

  body{
    margin:0;
    min-height:100dvh;
    height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;
    padding:clamp(10px, 2.4vh, 20px) clamp(10px, 2vw, 18px);
    font-family:'Manrope',sans-serif;
    color:var(--text-main);
    background:var(--page-gradient);
    transition:background .72s ease;
  }

  body.is-welcome-active .login-shell{
    transform:scale(0.94);
    opacity:0.14;
    filter:blur(14px);
    transition:transform .45s ease, opacity .45s ease, filter .45s ease;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(135deg, rgba(2,6,23,0.18) 0%, rgba(2,6,23,0.74) 100%),
      radial-gradient(circle at top, rgba(255,255,255,0.08) 0%, transparent 36%);
  }

  .background-photo{
    position:fixed;
    inset:-8%;
    background-image:var(--background-image);
    background-position:center;
    background-size:cover;
    filter:blur(18px) saturate(1.12) brightness(0.66);
    transform:scale(1.02);
    opacity:0;
    transition:opacity .55s ease, transform .75s ease;
    pointer-events:none;
  }

  .background-photo.has-image{
    opacity:0.92;
    transform:scale(1.08);
  }

  .ambient{
    position:fixed;
    border-radius:999px;
    filter:blur(14px);
    opacity:0.78;
    pointer-events:none;
    mix-blend-mode:screen;
    animation:floatOrb 16s ease-in-out infinite;
  }

  .ambient-a{
    top:-90px;
    left:-70px;
    width:320px;
    height:320px;
    background:radial-gradient(circle, rgba(var(--brand-primary-rgb),0.4) 0%, rgba(255,255,255,0) 68%);
  }

  .ambient-b{
    right:-70px;
    bottom:-90px;
    width:360px;
    height:360px;
    background:radial-gradient(circle, rgba(236,72,153,0.26) 0%, rgba(255,255,255,0) 68%);
    animation-delay:-5s;
  }

  .ambient-c{
    top:44%;
    left:50%;
    width:260px;
    height:260px;
    background:radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 72%);
    animation-delay:-10s;
  }

  .login-shell{
    position:relative;
    z-index:1;
    width:min(100%, 410px);
    max-height:100%;
    display:flex;
    align-items:center;
  }

  .login-card{
    position:relative;
    overflow:hidden;
    width:100%;
    max-height:calc(100dvh - 24px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:clamp(18px, 3.4vh, 34px) clamp(16px, 4vw, 28px);
    border-radius:26px;
    border:1px solid var(--card-border);
    background:linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06));
    box-shadow:var(--card-shadow);
    backdrop-filter:blur(18px);
    transform:translateY(0);
    transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease;
  }

  .login-card:hover{
    transform:translateY(-3px);
    box-shadow:0 36px 90px rgba(2, 6, 23, 0.5);
  }

  .login-card.is-branding-updating{
    animation:cardPulse .72s ease;
  }

  .login-card-glow{
    position:absolute;
    inset:auto -18% 58% auto;
    width:220px;
    height:220px;
    border-radius:999px;
    background:radial-gradient(circle, rgba(var(--brand-primary-rgb),0.38) 0%, rgba(var(--brand-primary-rgb),0) 72%);
    filter:blur(10px);
    pointer-events:none;
  }

  .logo-container{
    position:relative;
    width:clamp(72px, 11vh, 98px);
    height:clamp(72px, 11vh, 98px);
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    padding:0;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 18px 38px rgba(2, 6, 23, 0.32);
    overflow:hidden;
    transition:transform .35s ease, box-shadow .35s ease;
  }

  .logo-container.is-branding-updating{
    animation:logoBounce .7s ease;
  }

  .logo-container img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
    border-radius:50%;
  }

  h1{
    margin:0 0 6px;
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(24px, 5vw, 34px);
    line-height:1.04;
    letter-spacing:-0.03em;
    text-shadow:0 10px 28px rgba(2, 6, 23, 0.3);
  }

  .subtitle{
    text-align:center;
    color:var(--text-soft);
    font-size:13px;
    font-weight:600;
  }

  .company-hint{
    margin:8px auto 14px;
    max-width:260px;
    text-align:center;
    color:var(--text-faint);
    font-size:11.5px;
    line-height:1.4;
  }

  .input-group{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    margin:8px 0;
    border:1px solid var(--input-border);
    border-radius:16px;
    padding:0 12px;
    background:var(--input-surface);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
    transition:border-color .22s ease, box-shadow .22s ease, transform .22s ease, background .22s ease;
  }

  .input-group:focus-within{
    border-color:rgba(var(--brand-primary-rgb),0.5);
    box-shadow:0 0 0 4px rgba(var(--brand-primary-rgb),0.12), inset 0 1px 0 rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.14);
    transform:translateY(-1px);
  }

  .input-group.is-searching{
    box-shadow:0 0 0 4px rgba(var(--brand-primary-rgb),0.08), 0 0 28px rgba(var(--brand-primary-rgb),0.18);
  }

  .input-group.is-brand-loaded{
    border-color:rgba(var(--brand-primary-rgb),0.36);
  }

  .input-icon{
    width:18px;
    text-align:center;
    color:var(--text-soft);
    font-size:15px;
    flex:0 0 auto;
  }

  .input-group input{
    flex:1;
    height:46px;
    border:none;
    outline:none;
    background:transparent;
    color:var(--text-main);
    font-size:15px;
    font-weight:600;
    min-width:0;
  }

  .input-group input::placeholder{
    color:rgba(226,232,240,0.56);
    font-weight:500;
  }

  .toggle-pass{
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    border-radius:12px;
    cursor:pointer;
    color:var(--text-main);
    transition:background .18s ease, transform .18s ease;
  }

  .toggle-pass:hover{
    background:rgba(255,255,255,0.1);
    transform:translateY(-1px);
  }

  .login-btn,
  .customer-btn,
  .install-btn{
    width:100%;
    height:46px;
    margin-top:10px;
    border:none;
    border-radius:16px;
    font:inherit;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease, border-color .18s ease;
  }

  .login-btn{
    margin-top:12px;
    background:var(--button-gradient);
    color:#fff;
    font-size:16px;
    font-weight:800;
    box-shadow:0 18px 34px rgba(var(--brand-primary-rgb),0.28);
  }

  .login-btn:hover,
  .customer-btn:hover,
  .install-btn:hover{
    transform:translateY(-2px);
  }

  .login-btn:disabled{
    opacity:.74;
    cursor:wait;
    transform:none;
    filter:saturate(.85);
  }

  .customer-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.22);
    color:#fff;
    font-size:14px;
    font-weight:700;
    box-shadow:0 10px 24px rgba(2, 6, 23, 0.14);
  }

  .install-btn{
    background:rgba(255,255,255,0.92);
    color:#102341;
    font-size:14px;
    font-weight:800;
  }

  .forgot-link{
    display:block;
    margin-top:8px;
    text-align:center;
    color:var(--text-soft);
    font-size:12px;
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  #message{
    min-height:18px;
    margin-top:10px;
    text-align:center;
    font-size:12px;
    line-height:1.35;
    font-weight:700;
  }

  #message:empty{
    min-height:0;
    margin-top:0;
  }

  .welcome-overlay{
    position:fixed;
    inset:0;
    z-index:6;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    opacity:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 18% 14%, rgba(var(--brand-primary-rgb),0.16) 0%, transparent 30%),
      linear-gradient(140deg, rgba(2,6,23,0.34) 0%, rgba(2,6,23,0.76) 100%);
    backdrop-filter:blur(10px);
    transition:opacity .34s ease;
  }

  .welcome-overlay.is-visible{
    opacity:1;
    pointer-events:auto;
  }

  .welcome-overlay.is-exiting{
    opacity:0;
  }

  .welcome-panel{
    position:relative;
    width:min(100%, 520px);
    padding:28px 24px 22px;
    border-radius:32px;
    border:1px solid rgba(255,255,255,0.16);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06));
    box-shadow:0 36px 90px rgba(2, 6, 23, 0.46);
    overflow:hidden;
    transform:scale(.84) translateY(16px);
    transition:transform .52s cubic-bezier(.22,.9,.27,1), opacity .36s ease;
  }

  .welcome-overlay.is-visible .welcome-panel{
    transform:scale(1) translateY(0);
  }

  .welcome-overlay.is-zooming .welcome-panel{
    transform:scale(1.08) translateY(-3px);
  }

  .welcome-overlay.is-exiting .welcome-panel{
    transform:scale(1.14) translateY(-14px);
    opacity:0;
  }

  .welcome-panel::before{
    content:"";
    position:absolute;
    inset:-24% auto auto 54%;
    width:220px;
    height:220px;
    border-radius:999px;
    background:radial-gradient(circle, rgba(var(--brand-primary-rgb),0.34) 0%, rgba(var(--brand-primary-rgb),0) 72%);
    filter:blur(10px);
    pointer-events:none;
  }

  .welcome-emblem{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    width:132px;
    height:132px;
  }

  .welcome-rings{
    --ring-size:96px;
    position:absolute;
    top:50%;
    left:50%;
    width:var(--ring-size);
    height:var(--ring-size);
    margin-left:calc(var(--ring-size) / -2);
    margin-top:calc(var(--ring-size) / -2);
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.16);
    background:radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 72%);
    transform-origin:center;
    animation:welcomePulse 1.7s ease-in-out infinite;
  }

  .welcome-rings::before,
  .welcome-rings::after{
    content:"";
    position:absolute;
    inset:-12px;
    border-radius:50%;
    border:1px solid rgba(var(--brand-primary-rgb),0.22);
  }

  .welcome-rings::after{
    inset:-24px;
    opacity:.72;
  }

  .welcome-content{
    position:relative;
    z-index:1;
    display:grid;
    gap:14px;
    justify-items:center;
    text-align:center;
  }

  .welcome-logo-wrap{
    position:relative;
    width:104px;
    height:104px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 20px 38px rgba(2, 6, 23, 0.3);
    overflow:hidden;
  }

  .welcome-logo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
  }

  .welcome-chip-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
  }

  .welcome-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:36px;
    padding:0 14px;
    border-radius:999px;
    border:1px solid rgba(var(--brand-primary-rgb),0.22);
    background:rgba(var(--brand-primary-rgb),0.12);
    color:#fff;
    font-size:12px;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .welcome-chip.is-soft{
    border-color:rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.08);
    color:var(--text-soft);
  }

  .welcome-title{
    margin:0;
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(28px, 6vw, 42px);
    line-height:1.02;
    letter-spacing:-0.04em;
    text-shadow:0 16px 36px rgba(2, 6, 23, 0.34);
  }

  .welcome-copy{
    margin:0;
    max-width:360px;
    color:var(--text-soft);
    font-size:14px;
    line-height:1.6;
  }

  .welcome-progress{
    width:min(100%, 280px);
    height:8px;
    border-radius:999px;
    overflow:hidden;
    background:rgba(255,255,255,0.1);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .welcome-progress span{
    display:block;
    width:100%;
    height:100%;
    transform-origin:left center;
    transform:scaleX(0);
    background:var(--button-gradient);
    border-radius:inherit;
  }

  .welcome-overlay.is-visible .welcome-progress span{
    animation:welcomeLoad 1.22s cubic-bezier(.22,.9,.3,1) forwards;
  }

  @keyframes floatOrb{
    0%,100%{transform:translate3d(0,0,0)}
    50%{transform:translate3d(0,-18px,0)}
  }

  @keyframes cardPulse{
    0%{transform:translateY(0) scale(1)}
    35%{transform:translateY(-4px) scale(1.01)}
    100%{transform:translateY(0) scale(1)}
  }

  @keyframes logoBounce{
    0%{transform:translateY(0) scale(1)}
    35%{transform:translateY(-6px) scale(1.04)}
    100%{transform:translateY(0) scale(1)}
  }

  @keyframes welcomePulse{
    0%,100%{transform:scale(.98); opacity:.82}
    50%{transform:scale(1.06); opacity:1}
  }

  @keyframes welcomeLoad{
    from{transform:scaleX(0)}
    to{transform:scaleX(1)}
  }

  @media (max-width: 520px){
    body{
      padding:10px;
    }

    .login-shell{
      width:100%;
    }

    .login-card{
      max-height:calc(100dvh - 20px);
      padding:18px 14px 14px;
      border-radius:22px;
    }

    .logo-container{
      width:74px;
      height:74px;
      margin-bottom:10px;
    }

    h1{
      font-size:24px;
    }

    .company-hint{
      display:none;
    }

    .input-group input{
      height:44px;
    }

    .login-btn,
    .customer-btn,
    .install-btn{
      height:44px;
      margin-top:8px;
    }

    .welcome-panel{
      padding:24px 18px 18px;
      border-radius:26px;
    }

    .welcome-emblem{
      width:112px;
      height:112px;
    }

    .welcome-logo-wrap{
      width:88px;
      height:88px;
    }

    .welcome-title{
      font-size:28px;
    }
  }

  @media (max-height: 760px){
    body{
      padding:8px;
    }

    .login-card{
      max-height:calc(100dvh - 16px);
      padding:16px 14px 12px;
      border-radius:22px;
    }

    .logo-container{
      width:68px;
      height:68px;
      margin-bottom:8px;
    }

    h1{
      font-size:22px;
      margin-bottom:4px;
    }

    .subtitle{
      font-size:12px;
    }

    .company-hint{
      display:none;
    }

    .input-group{
      margin:6px 0;
      border-radius:14px;
    }

    .input-group input,
    .login-btn,
    .customer-btn,
    .install-btn{
      height:42px;
    }

    .forgot-link{
      margin-top:6px;
      font-size:11px;
    }

    #message{
      margin-top:8px;
      font-size:11px;
    }
  }
</style>
</head>
<body>
<div id="backgroundPhoto" class="background-photo" aria-hidden="true"></div>
<div class="ambient ambient-a" aria-hidden="true"></div>
<div class="ambient ambient-b" aria-hidden="true"></div>
<div class="ambient ambient-c" aria-hidden="true"></div>

<main class="login-shell">
  <section class="login-card" id="loginCard">
    <div class="login-card-glow" aria-hidden="true"></div>
    <div class="logo-container" id="logoContainer">
      <img id="brandLogo" src="/logo.png" alt="Company Logo">
    </div>
    <h1 id="loginTitle">GMS ERP Login</h1>
    <div class="subtitle" id="loginSubtitle">Sign in to continue</div>
    <div class="company-hint" id="brandingHint">Type your company code to preview your company theme before logging in.</div>

    <div class="input-group company-code-group" id="companyCodeGroup">
      <span class="input-icon"><i class="fa-regular fa-building"></i></span>
      <input type="text" id="companyCode" placeholder="Company Code">
    </div>

    <div class="input-group">
      <span class="input-icon"><i class="fa-regular fa-user"></i></span>
      <input type="text" id="idNumber" placeholder="ID Number">
    </div>

    <div class="input-group">
      <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
      <input type="password" id="password" placeholder="Password">
      <div class="toggle-pass" id="togglePass"><i class="fa-regular fa-eye"></i></div>
    </div>

    <button id="loginBtn" class="login-btn">Log In</button>
    <a id="forgotPasswordBtn" class="forgot-link" href="/renderer/forgot_password.html">Forgot Password?</a>
    <button id="customerPortalBtn" class="customer-btn" type="button">Customer Request &amp; Chat</button>
    <button id="installAppBtn" class="install-btn" type="button">Install</button>
    <div id="message"></div>
  </section>
</main>

<div id="welcomeOverlay" class="welcome-overlay" hidden aria-hidden="true">
  <section class="welcome-panel" aria-live="polite">
    <div class="welcome-content">
      <div class="welcome-emblem">
        <div class="welcome-rings" aria-hidden="true"></div>
        <div class="welcome-logo-wrap">
          <img id="welcomeLogo" src="/logo.png" alt="Welcome Logo">
        </div>
      </div>
      <div class="welcome-chip-row">
        <span class="welcome-chip" id="welcomeRoleChip">Workspace</span>
        <span class="welcome-chip is-soft" id="welcomeDestinationChip">Loading panel</span>
      </div>
      <h2 class="welcome-title" id="welcomeTitle">Welcome</h2>
      <p class="welcome-copy" id="welcomeCopy">Preparing your workspace.</p>
      <div class="welcome-progress" aria-hidden="true"><span></span></div>
    </div>
  </section>
</div>

<script src="shared/app-client.js"></script>
<script src="shared/pwa.js"></script>
<script src="renderer/login.js"></script>
</body>
</html>
