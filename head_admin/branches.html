<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="gms-disable-cached-brand-theme" content="true">
  <title>Branch Management</title>
  <script src="../shared/theme-preload.js"></script>
  <style>
    :root {
      --bg: #edf2f8;
      --bg-shade: #dbe7f7;
      --card: rgba(255, 255, 255, 0.94);
      --line: #dbe5f1;
      --text: #102341;
      --muted: #5a6f8f;
      --primary: #2b64e3;
      --primary-dark: #1849b9;
      --shadow: 0 18px 40px rgba(18, 40, 78, 0.14);
      --success-bg: #dcfce7;
      --success-text: #166534;
      --danger-bg: #fee2e2;
      --danger-text: #991b1b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI Variable", "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, #d5e4ff 0%, transparent 42%),
        radial-gradient(circle at bottom left, #d7ecff 0%, transparent 38%),
        linear-gradient(160deg, var(--bg), var(--bg-shade));
      min-height: 100vh;
    }

    .wrap { max-width: 1060px; margin: 0 auto; padding: 30px 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    h1 { margin: 0; font-size: clamp(24px, 3vw, 32px); letter-spacing: 0.2px; }
    .muted { color: var(--muted); font-size: 13px; }
    #limitText {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      background: #eef4ff;
      border: 1px solid #d8e5ff;
      color: #27457a;
      font-weight: 600;
    }

    .status {
      margin: 0 0 12px;
      min-height: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #1f3a68;
    }

    .form {
      display: grid;
      grid-template-columns: minmax(220px, 1.1fr) minmax(240px, 1.4fr) auto;
      gap: 10px;
      margin: 16px 0 14px;
    }

    input {
      width: 100%;
      height: 42px;
      padding: 10px 12px;
      border: 1px solid #c6d3e4;
      border-radius: 12px;
      background: #fff;
      font: inherit;
      color: #0f172a;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    button {
      border: none;
      border-radius: 12px;
      height: 42px;
      padding: 0 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: .65; cursor: not-allowed; transform: none; }

    .form button {
      background: linear-gradient(140deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 8px 16px rgba(30, 85, 197, 0.35);
    }

    .table-shell {
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: auto;
      background: #fff;
    }
    table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 660px; }
    th, td {
      border-bottom: 1px solid #e8eef6;
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }
    th {
      background: linear-gradient(180deg, #f8fbff, #f1f6fe);
      color: #2b3f62;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .5px;
      font-weight: 700;
    }
    tbody tr:hover { background: #f8fbff; }
    tbody tr:last-child td { border-bottom: none; }
    .empty-row { text-align: center; color: var(--muted); padding: 22px 14px; }

    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .pill.active { background: var(--success-bg); color: var(--success-text); }
    .pill.inactive { background: var(--danger-bg); color: var(--danger-text); }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions button {
      height: 30px;
      border-radius: 9px;
      font-size: 12px;
      padding: 0 10px;
      font-weight: 700;
    }
    .actions .edit { background: #e4edff; color: #214ea9; }
    .actions .toggle { background: #eef2f7; color: #1f2f46; }
    .actions .delete { background: #fee2e2; color: #991b1b; }
    .actions .edit:hover { background: #d6e5ff; }
    .actions .toggle:hover { background: #dfe7f1; }
    .actions .delete:hover { background: #fecaca; }

    @media (max-width: 760px) {
      .wrap { padding: 20px 12px 26px; }
      .card { padding: 16px; border-radius: 18px; }
      .form { grid-template-columns: 1fr; }
      .form button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Branch Management</h1>
      <div id="limitText" class="muted">Loading limits...</div>
      <div class="form">
        <input id="branchName" type="text" placeholder="Branch name">
        <input id="branchAddress" type="text" placeholder="Address (optional)">
        <button id="addBranchBtn" type="button">Add Branch</button>
      </div>
      <div id="status" class="status"></div>
      <div class="table-shell">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Address</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="branchTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="../shared/app-client.js"></script>
  <script src="./branches.js"></script>
</body>
</html>
