<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:">
  <title>Incident Report Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="../shared/theme-preload.js"></script>
  <link rel="stylesheet" href="../shared/incident-report.css?v=20260728-admin-review-v2">
</head>
<body class="incident-page">
  <main class="incident-shell">
    <header class="incident-header">
      <div>
        <p class="incident-eyebrow">Employee Submissions</p>
        <h1>Incident Report</h1>
        <p class="incident-header-meta" id="headerMeta">Head Admin</p>
      </div>
      <div class="incident-header-actions">
        <button class="incident-button incident-button--primary" id="refreshBtn" type="button">
          <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
          <span>Refresh</span>
        </button>
      </div>
    </header>

    <section class="incident-summary" aria-label="Incident report summary">
      <article class="incident-stat">
        <span>Total reports</span>
        <strong id="totalCount">0</strong>
        <small>All employee submissions</small>
      </article>
      <article class="incident-stat incident-stat--unresolved">
        <span>Not resolved</span>
        <strong id="unresolvedCount">0</strong>
        <small>Needs admin review</small>
      </article>
      <article class="incident-stat incident-stat--resolved">
        <span>Resolved</span>
        <strong id="resolvedCount">0</strong>
        <small>Completed incidents</small>
      </article>
    </section>

    <section class="incident-workspace">
      <div class="incident-toolbar incident-toolbar--admin-review">
        <label class="incident-field">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Employee, department, or incident...">
        </label>
        <label class="incident-field">
          <span>Status</span>
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="unresolved">Not resolved</option>
            <option value="resolved">Resolved</option>
          </select>
        </label>
        <label class="incident-field">
          <span>Date from</span>
          <input id="dateFromFilter" type="date">
        </label>
        <label class="incident-field">
          <span>Date to</span>
          <input id="dateToFilter" type="date">
        </label>
      </div>

      <div class="incident-table-wrap">
        <div class="incident-table-canvas incident-table-canvas--admin-review">
          <table class="incident-table incident-table--admin-review" data-mobile-card="off">
            <thead>
              <tr>
                <th>Date</th>
                <th>Employee</th>
                <th>Department</th>
                <th>Reason / Incident</th>
                <th>How to Solve / Action Taken</th>
                <th>Prepared By</th>
                <th>Checked By</th>
                <th>Status</th>
                <th>Review</th>
              </tr>
            </thead>
            <tbody id="incidentTableBody">
              <tr><td class="incident-empty" colspan="9">Loading incident reports...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
    <div class="incident-page-status" id="pageStatus" role="status"></div>
  </main>

  <div class="incident-toast" id="toast" role="status" hidden></div>

  <script src="../shared/app-client.js?v=20260728-admin-review-v1"></script>
  <script src="./incident_report.js?v=20260728-admin-review-v1"></script>
</body>
</html>
